<head>

<body class="">
<div class="canvas"><div class="phone "><div class="statusbar"><span>9:41</span><span class="sb-icons"><i class="sig"></i><i class="wifi"></i><i class="bat"></i></span></div><div class="screen">
<header class="topbar"><a class="iconbtn" href="welcome.html"><svg class="ic " width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a><h1></h1><span class="right"></span></header>
<div class="pad">
  <h1 class="h1">Create Your Account</h1><p class="sub">Join RoomStay and find your new home</p>
  <label class="field"><span>Full Name</span><div class="input"><svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input value="Su Yi Nandar"></div></label>
  <label class="field"><span>Email</span><div class="input"><svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><input value="suyi@example.com"></div></label>
  <label class="field"><span>Password</span><div class="input"><svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" value="password123"><svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div></label>
  <label class="field"><span>I want to</span><div class="seg"><button class="on">Rent a room</button><button>List my property</button></div></label>
  <label class="check"><input type="checkbox" checked><span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span></label>
  <a class="btn primary block" href="home.html">Sign Up</a>
  <p class="fine center">Already have an account? <a href="login.html">Log in</a></p>
</div></div></div></div><script src="../js/ui.js"></script>
