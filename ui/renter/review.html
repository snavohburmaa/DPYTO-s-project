<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="">
<div class="canvas"><div class="phone "><div class="statusbar"><span>9:41</span><span class="sb-icons"><i class="sig"></i><i class="wifi"></i><i class="bat"></i></span></div><div class="screen">
<header class="topbar"><a class="iconbtn" href="bookings.html"><svg class="ic " width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a><h1>Leave a Review</h1><span class="right"></span></header>
<div class="pad">
  <div class="ctx-card"><img class="photo" src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800&q=70" alt="" loading="lazy" onerror="this.classList.add('fallback')"><div><b>Spacious Apartment</b><small>Chatuchak, Bangkok</small><small>Stayed 1 May 2024 to 30 Apr 2025</small></div></div>
  <div class="field"><span>Your Rating</span><div class="star-input"><b class="on">★</b><b class="on">★</b><b class="on">★</b><b class="on">★</b><b class="on">★</b></div></div>
  <label class="field"><span>Your Review</span><textarea rows="4">The room is clean and comfortable. The owner is very kind and responsive. Highly recommend!</textarea></label>
  <div class="field"><span>Add photos (optional)</span><div class="photo-row"><div class="thumb sm"><img class="photo" src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800&q=70" alt="" loading="lazy" onerror="this.classList.add('fallback')"></div><div class="thumb sm"><img class="photo" src="https://images.unsplash.com/photo-1536376072261-38c75010e6c9?w=800&q=70" alt="" loading="lazy" onerror="this.classList.add('fallback')"></div><button class="thumb sm add"><svg class="ic " width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div></div>
  <div class="note info"><svg class="ic " width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Only renters with a completed booking can review. Reviews are public on the listing.</div>
</div>
<div class="sticky-cta"><a class="btn primary block" href="bookings.html">Submit Review</a></div></div></div></div><script src="../js/ui.js"></script>
</body>
</html>
