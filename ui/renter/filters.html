<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="">
<div class="canvas"><div class="phone "><div class="statusbar"><span>9:41</span><span class="sb-icons"><i class="sig"></i><i class="wifi"></i><i class="bat"></i></span></div><div class="screen">
<header class="topbar"><a class="iconbtn" href="search.html"><svg class="ic " width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a><h1>Filters</h1><span class="right"><a class="link" href="#">Reset</a></span></header>
<div class="pad">
  <label class="field"><span>Location</span><div class="input select"><input value="Ari, Bangkok"><svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div></label>
  <div class="field"><span>Price Range (per month)</span>
    <div class="range"><div class="track"><div class="fill" style="left:22%;right:38%"></div><i style="left:22%"></i><i style="right:38%"></i></div><div class="range-lbl"><span>฿3,000</span><span>฿50,000</span></div></div></div>
  <div class="field"><span>Room Type</span><div class="pills"><button class="pill on">All</button><button class="pill">Apartment</button><button class="pill">Condo</button><button class="pill">House</button><button class="pill">Room</button></div></div>
  <div class="field"><span>Bedrooms</span><div class="pills"><button class="pill on">Any</button><button class="pill">1</button><button class="pill">2</button><button class="pill">3+</button></div></div>
  <div class="field"><span>Facilities</span><div class="checklist"><label class="check"><input type="checkbox" checked><span>Wi-Fi</span></label><label class="check"><input type="checkbox" checked><span>Air Conditioner</span></label><label class="check"><input type="checkbox" ><span>Furnished</span></label><label class="check"><input type="checkbox" ><span>Parking</span></label><label class="check"><input type="checkbox" ><span>Elevator</span></label><label class="check"><input type="checkbox" ><span>Security</span></label></div></div>
  <div class="field"><span>Availability</span><div class="pills"><button class="pill on">Available now</button><button class="pill">From a date</button></div></div>
</div>
<div class="sticky-cta"><a class="btn primary block" href="search.html">Show 128 Results</a></div></div></div></div><script src="../js/ui.js"></script>
</body>
</html>
