<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<body class="">
<div class="canvas"><div class="phone "><div class="statusbar"><span>9:41</span><span class="sb-icons"><i class="sig"></i><i class="wifi"></i><i class="bat"></i></span></div><div class="screen">
<header class="topbar"><a class="iconbtn" href="room.html"><svg class="ic " width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a><h1>Request Viewing</h1><span class="right"></span></header>
<div class="pad">
  <div class="ctx-card"><img class="photo" src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=800&q=70" alt="" loading="lazy" onerror="this.classList.add('fallback')"><div><b>Cozy Condo Near BTS</b><small>Ari, Bangkok</small><small><b>฿10,000</b> / month</small></div></div>
  <div class="field"><span>Select Date</span>
    <div class="cal"><div class="cal-head"><button class="iconbtn"><svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button><b>June 2025</b><button class="iconbtn"><svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div>
      <div class="cal-dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="cal-grid"><button class=" dim">25</button><button class=" dim">26</button><button class=" dim">27</button><button class=" dim">28</button><button class=" dim">29</button><button class=" dim">30</button><button class=" dim">31</button><button class="">1</button><button class="">2</button><button class="">3</button><button class="">4</button><button class="">5</button><button class="">6</button><button class="">7</button><button class="">8</button><button class="">9</button><button class="">10</button><button class="">11</button><button class="">12</button><button class="">13</button><button class="on">14</button><button class="">15</button><button class="">16</button><button class="">17</button><button class="">18</button><button class="">19</button><button class="">20</button><button class="">21</button><button class="">22</button><button class="">23</button><button class="">24</button><button class="">25</button><button class="">26</button><button class="">27</button><button class="">28</button><button class="">29</button><button class="">30</button><button class="">1</button><button class="">2</button><button class="">3</button><button class="">4</button><button class="">5</button></div></div></div>
  <div class="field"><span>Select Time</span><div class="pills wrap"><button class="pill">10:00 AM</button><button class="pill on">02:00 PM</button><button class="pill">04:00 PM</button><button class="pill">06:00 PM</button></div></div>
  <label class="field"><span>Message (Optional)</span><textarea rows="3">I would like to see the room and know more details.</textarea></label>
  <div class="note info"><svg class="ic " width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> The owner can approve, suggest another time, or decline with a reason. You will get a notification.</div>
</div>
<div class="sticky-cta"><a class="btn primary block" href="bookings.html">Send Request</a></div></div></div></div><script src="../js/ui.js"></script>
